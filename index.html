<!DOCTYPE html>
<html>

<head>
    <title>Simple AR - A Web based AR for A-Frame</title>
    <script src="aframe-v1.5.0.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style>
        .countdown-container {
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 1000;
            width: 95%;
            max-width: 400px;
        }
        
        .countdown-title {
            color: #ff6b6b;
            font-family: Arial, sans-serif;
            font-size: clamp(16px, 5vw, 24px);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            margin-bottom: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: clamp(6px, 2vw, 8px) clamp(15px, 4vw, 20px);
            border-radius: 8px;
            border: 2px solid #fff;
            box-shadow: 0 0 15px rgba(255, 107, 107, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        
        .countdown-timer {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: clamp(10px, 3vw, 15px) clamp(15px, 4vw, 25px);
            border-radius: 10px;
            font-family: Arial, sans-serif;
            text-align: center;
            border: 2px solid #fff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .timer-unit {
            flex: 1;
            margin: 0 clamp(2px, 1vw, 5px);
        }
        
        .timer-number {
            font-size: clamp(18px, 6vw, 24px);
            font-weight: bold;
            color: #4ecdc4;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        
        .timer-label {
            font-size: clamp(10px, 3vw, 12px);
            text-transform: uppercase;
            color: #ffffff;
            margin-top: 2px;
        }

        /* Portrait Mode Optimierungen */
        @media (orientation: portrait) and (max-height: 700px) {
            .countdown-container {
                bottom: 5px;
            }
            
            .countdown-title {
                margin-bottom: 5px;
                padding: 5px 15px;
            }
            
            .countdown-timer {
                padding: 8px 15px;
            }
            
            .timer-number {
                font-size: clamp(16px, 5vw, 20px);
            }
            
            .timer-label {
                font-size: clamp(9px, 2.5vw, 11px);
            }
        }

        /* Landscape Mode Optimierungen */
        @media (orientation: landscape) and (max-height: 500px) {
            .countdown-container {
                bottom: 5px;
                width: 90%;
                max-width: 500px;
            }
            
            .countdown-title {
                font-size: clamp(14px, 4vw, 20px);
                margin-bottom: 5px;
                padding: 4px 15px;
            }
            
            .countdown-timer {
                padding: 6px 20px;
            }
            
            .timer-number {
                font-size: clamp(16px, 4vw, 20px);
            }
            
            .timer-label {
                font-size: clamp(8px, 2vw, 10px);
            }
        }

        /* Sehr kleine Displays */
        @media (max-width: 320px) {
            .countdown-container {
                width: 98%;
            }
            
            .timer-unit {
                margin: 0 1px;
            }
            
            .timer-label {
                font-size: 9px;
            }
        }

        /* Touch-Optimierungen */
        @media (hover: none) and (pointer: coarse) {
            .countdown-container {
                /* Größerer Touch-Bereich */
                padding: 5px;
            }
        }
    </style>
</head>

<body>
    <!-- Countdown Container -->
    <div class="countdown-container">
        <div class="countdown-title">⛄ Tage bis Weihnachten ⛄</div>
        <div id="countdown" class="countdown-timer">
            <div class="timer-unit">
                <div class="timer-number" id="days">00</div>
                <div class="timer-label">Tage</div>
            </div>
            <div class="timer-unit">
                <div class="timer-number" id="hours">00</div>
                <div class="timer-label">Stunden</div>
            </div>
            <div class="timer-unit">
                <div class="timer-number" id="minutes">00</div>
                <div class="timer-label">Minuten</div>
            </div>
            <div class="timer-unit">
                <div class="timer-number" id="seconds">00</div>
                <div class="timer-label">Sekunden</div>
            </div>
        </div>
    </div>

    <script src="simple-ar.min.js" onload="onWasmLoaded();"></script>
    <a-scene>
        <a-entity simple-ar="src: Foto.png; minCutOffValue: 1; betaValue:0.1;">
            <a-entity id="snow"></a-entity>
            <!-- Tanzender Schneemann - ZENTRIERT und näher an der Kamera -->
            <a-entity id="snowman" position="0 0 -3" scale="0.8 0.8 0.8" visible="true">
                <!-- Unterer Schneeball -->
                <a-sphere position="0 0.5 0" radius="0.4" color="#FFFFFF" roughness="0.3"></a-sphere>
                <!-- Mittlerer Schneeball -->
                <a-sphere position="0 1.2 0" radius="0.3" color="#FFFFFF" roughness="0.3"></a-sphere>
                <!-- Oberer Schneeball -->
                <a-sphere position="0 1.8 0" radius="0.2" color="#FFFFFF" roughness="0.3"></a-sphere>
                
                <!-- Augen -->
                <a-sphere position="-0.05 1.85 0.18" radius="0.02" color="#000000"></a-sphere>
                <a-sphere position="0.05 1.85 0.18" radius="0.02" color="#000000"></a-sphere>
                
                <!-- Nase (Karotte) -->
                <a-cone position="0 1.8 0.2" radius-bottom="0.02" radius-top="0.01" height="0.1" 
                       color="#FF8C00" rotation="-30 0 0"></a-cone>
                
                <!-- Mund -->
                <a-entity position="0 1.75 0.18" rotation="0 0 0">
                    <a-sphere position="-0.03 0 0" radius="0.01" color="#000000"></a-sphere>
                    <a-sphere position="0 0 0" radius="0.01" color="#000000"></a-sphere>
                    <a-sphere position="0.03 0 0" radius="0.01" color="#000000"></a-sphere>
                </a-entity>
                
                <!-- Hut -->
                <a-cylinder position="0 2.0 0" radius="0.15" height="0.08" color="#000000" 
                           open-ended="true"></a-cylinder>
                <a-cylinder position="0 1.92 0" radius="0.25" height="0.03" color="#000000"></a-cylinder>
                
                <!-- Arme -->
                <a-cylinder id="left-arm" position="-0.35 1.2 0" radius="0.02" height="0.4" 
                           color="#8B4513" rotation="0 0 -30"></a-cylinder>
                <a-cylinder id="right-arm" position="0.35 1.2 0" radius="0.02" height="0.4" 
                           color="#8B4513" rotation="0 0 30"></a-cylinder>
                
                <!-- Schal -->
                <a-torus position="0 1.35 0" arc="360" radius="0.32" radius-tubular="0.02" 
                        color="#FF0000" rotation="90 0 0"></a-torus>
                
                <!-- Tanz-Animationen -->
                <a-animation attribute="rotation" dur="2000" to="0 360 0" repeat="indefinite" easing="linear"></a-animation>
                <a-animation attribute="position" dur="3000" from="0 0 -3" to="0.8 0 -3" 
                           direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
                <a-animation attribute="scale" dur="1500" from="0.8 0.8 0.8" to="0.85 0.85 0.85" 
                           direction="alternate" repeat="indefinite" easing="easeInOutSine"></a-animation>
            </a-entity>
        </a-entity>
        <a-camera position="0 0 0"></a-camera>
    </a-scene>

    <script>
        // Countdown Timer Funktion
        function updateCountdown() {
            const now = new Date();
            const currentYear = now.getFullYear();
            let targetDate = new Date(currentYear, 11, 24); // 24. Dezember dieses Jahres
            
            // Wenn der 24. Dezember bereits vorbei ist, nächstes Jahr anzeigen
            if (now > targetDate) {
                targetDate = new Date(currentYear + 1, 11, 24);
            }
            
            const timeDifference = targetDate - now;
            
            if (timeDifference <= 0) {
                document.getElementById('days').textContent = '00';
                document.getElementById('hours').textContent = '00';
                document.getElementById('minutes').textContent = '00';
                document.getElementById('seconds').textContent = '00';
                
                // Titel ändern, wenn Weihnachten da ist
                document.querySelector('.countdown-title').textContent = '🎄 Frohe Weihnachten! 🎄';
                
                // Spezial-Animation für Weihnachten
                const snowman = document.getElementById('snowman');
                snowman.setAttribute('animation__jump', {
                    property: 'position',
                    from: '0 0 -3',
                    to: '0 0.5 -3',
                    dur: 500,
                    direction: 'alternate',
                    repeat: 'indefinite'
                });
                return;
            }
            
            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);
            
            document.getElementById('days').textContent = days.toString().padStart(2, '0');
            document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
            document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
            document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
            
            // Spezielle Animationen basierend auf verbleibenden Tagen
            updateSnowmanAnimation(days);
        }
        
        // Schneemann-Animation basierend auf Tagen bis Weihnachten
        function updateSnowmanAnimation(days) {
            const leftArm = document.getElementById('left-arm');
            const rightArm = document.getElementById('right-arm');
            const snowman = document.getElementById('snowman');
            
            // Arme bewegen - Winken-Animation
            leftArm.setAttribute('animation', {
                property: 'rotation',
                from: '0 0 -30',
                to: '0 0 -60',
                dur: 800,
                direction: 'alternate',
                repeat: 'indefinite',
                easing: 'easeInOutSine'
            });
            
            rightArm.setAttribute('animation', {
                property: 'rotation',
                from: '0 0 30',
                to: '0 0 60',
                dur: 800,
                direction: 'alternate',
                repeat: 'indefinite',
                easing: 'easeInOutSine'
            });
            
            // Verschiedene Tanzstile basierend auf Tagen
            if (days <= 3) {
                // Aufgeregter Tanz - nur noch wenige Tage
                snowman.setAttribute('animation__excited', {
                    property: 'position',
                    from: '0 0 -3',
                    to: '0 0.2 -3',
                    dur: 300,
                    direction: 'alternate',
                    repeat: 'indefinite',
                    easing: 'easeInOutBack'
                });
            } else if (days <= 10) {
                // Mittlerer Tanz - etwas größer
                snowman.setAttribute('scale', '0.9 0.9 0.9');
            }
        }
        
        // Timer starten
        updateCountdown();
        setInterval(updateCountdown, 1000);

        // Viewport Anpassung für Mobile
        function adjustViewport() {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        // Initial anpassen und bei Resize
        adjustViewport();
        window.addEventListener('resize', adjustViewport);
        window.addEventListener('orientationchange', adjustViewport);

        // Schnee-Animation Code (ursprünglicher Code)
        const targetObject = document.querySelector('#snow');

        for (let i = 0; i < 100; i++) {
            const plane = document.createElement('a-plane');
            const size = (Math.random() * .3 + 0.03).toFixed(2);

            const startX = (Math.random() - 0.5) * 8;
            const startY = Math.random() * 6 + 2;
            const startZ = (Math.random() - 0.5) * 8;

            const endY = -10;

            plane.setAttribute('width', size);
            plane.setAttribute('height', size);
            plane.setAttribute('position', `${startX} ${startY} ${startZ}`);
            plane.setAttribute('material', {
                src: 'snowflake.png',
                alphaTest: 0.5
            });

            const duration = 4000 + Math.random() * 3000;

            plane.setAttribute('animation__fall', {
                property: 'position',
                from: `${startX} ${startY} ${startZ}`,
                to: `${startX} ${endY} ${startZ}`,
                dur: duration,
                easing: 'linear',
                loop: true
            });

            plane.addEventListener('animationloop', () => {
                const newX = (Math.random() - 0.5) * 8;
                const newY = Math.random() * 6 + 2;
                const newZ = (Math.random() - 0.5) * 8;

                plane.setAttribute('animation__fall', {
                    from: `${newX} ${newY} ${newZ}`,
                    to: `${newX} ${endY} ${newZ}`,
                    dur: 4000 + Math.random() * 3000
                });
            });

            targetObject.appendChild(plane);
        }
        
        // Interaktion mit dem Schneemann
        document.addEventListener('click', function() {
            const snowman = document.getElementById('snowman');
            
            // Kurzer Sprung beim Klick
            snowman.setAttribute('animation__click', {
                property: 'position',
                from: snowman.getAttribute('position'),
                to: `${snowman.object3D.position.x} ${snowman.object3D.position.y + 0.3} ${snowman.object3D.position.z}`,
                dur: 300,
                direction: 'alternate',
                easing: 'easeOutQuad'
            });
            
            // Animation nach kurzer Zeit entfernen
            setTimeout(() => {
                snowman.removeAttribute('animation__click');
            }, 600);
        });

        // Automatische Positionierung nach AR-Erkennung
        setTimeout(() => {
            const snowman = document.getElementById('snowman');
            // Sicherstellen, dass der Schneemann sichtbar ist
            snowman.setAttribute('visible', 'true');
        }, 2000);
    </script>
</body>

</html>
